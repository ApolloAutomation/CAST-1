substitutions:
  version: "26.8.26.4"
  # Manifest bases: stable=Pages, beta=release assets
  stable_manifest_base: "https://apolloautomation.github.io/CAST-1"
  beta_manifest_base: "https://github.com/ApolloAutomation/CAST-1/releases/download/beta-fw"
  # Manifest targets for this build; legacy variant files override these so
  # already-deployed devices keep updating from their original URLs.
  stable_manifest_dir: "firmware"
  beta_manifest_file: "manifest.json"


packages:
  wizmote: !include wizmote.yaml

esphome:
  friendly_name: Apollo CAST-1
  comment: Apollo CAST-1
  name_add_mac_suffix: true
  # network: priority: (WiFi + Ethernet in one firmware) needs 2026.8
  min_version: 2026.8.0
  platformio_options:
    board_build.flash_mode: dio
  # List form so package on_boot entries (wizmote.yaml) merge
  on_boot:
    - priority: 800
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - lambda: "id(testScript).execute();"
    # A device whose WiFi was released while on Ethernet boots with WiFi
    # (and its hotspot) off: with no STA credentials the fallback AP would
    # otherwise broadcast until Ethernet gets its DHCP lease. Runs after
    # globals restore (800), before wifi setup (245). Safe mode skips
    # on_boot entirely, so WiFi always starts there for recovery. ESP-NOW
    # self-inits on channel 1 (legacy Ethernet-firmware default) when WiFi
    # is off at setup.
    - priority: 600
      then:
        - if:
            condition:
              lambda: "return id(ethernet_expected);"
            then:
              - lambda: |-
                  id(wifi_1).set_enable_on_boot(false);
                  id(espnow_component).set_wifi_channel(1);
    # No Ethernet HAT: the W5500 driver's helper task is created before chip
    # verification and survives the failed install; left running it polls
    # the floating SPI bus and eventually corrupts memory (Cache error
    # panics every ~100s, observed on hardware). Park it. Runs right after
    # ethernet's setup (250).
    - priority: 200
      then:
        - if:
            condition:
              lambda: "return id(ethernet_1).is_failed();"
            then:
              - lambda: |-
                  TaskHandle_t orphan = xTaskGetHandle("w5500_tsk");
                  if (orphan != nullptr) {
                    vTaskSuspend(orphan);
                    ESP_LOGW("ethernet", "No Ethernet HAT detected; parked the W5500 helper task");
                  }
    - priority: 500
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"
    # Point update entity at selected manifest
    - priority: -100
      then:
        - script.execute: apply_ota_source
    # Ethernet was expected but never came up: bring WiFi back so the
    # device can rejoin a network or open the provisioning hotspot.
    - priority: -100
      then:
        - if:
            condition:
              lambda: "return id(ethernet_expected);"
            then:
              - wait_until:
                  condition:
                    ethernet.connected:
                  timeout: 20s
              - if:
                  condition:
                    not:
                      ethernet.connected:
                  then:
                    - lambda: "id(ethernet_expected) = false;"
                    - wifi.enable:
    # Re-apply persisted Bluetooth Proxy state
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

safe_mode:
  id: safe_mode_1

logger:
  id: logger_1

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: ${stable_manifest_base}/${stable_manifest_dir}/manifest.json

# Both interfaces live in one firmware (ESPHome 2026.8+); Ethernet is
# preferred whenever connected and ESPHome arbitrates the default route.
network:
  id: network_1
  priority:
    - ethernet
    - wifi

ethernet:
  id: ethernet_1
  type: W5500
  clock_speed: 40MHz
  clk_pin: GPIO7
  mosi_pin: GPIO12
  miso_pin: GPIO11
  cs_pin: GPIO6
  interrupt_pin: GPIO13
  reset_pin: GPIO21
  on_connect:
    # Ethernet is up. If WiFi is (or is about to be) connected to a network,
    # keep it: the device runs dual-homed — Ethernet carries the routed
    # traffic (network: priority:) while Home Assistant's connection to the
    # WiFi address survives, so no rediscovery is ever needed. WiFi is turned
    # off only when it has nothing to offer (hotspot active or nothing to
    # join), which also guarantees the hotspot is never up while on Ethernet.
    - if:
        condition:
          wifi.enabled:
        then:
          - if:
              condition:
                wifi.ap_active:
              then:
                # Fallback hotspot is broadcasting: WiFi has no network.
                - script.execute: wifi_release_radio
              else:
                # Boot race: WiFi may still be associating; give it a moment.
                # The wait also ends the instant the fallback AP starts (WiFi
                # lost 60-90s before the cable arrived), so the hotspot is
                # torn down within a loop pass instead of broadcasting for
                # the rest of the window.
                - wait_until:
                    condition:
                      or:
                        - wifi.connected:
                        - wifi.ap_active:
                    timeout: 30s
                - if:
                    condition:
                      wifi.connected:
                    then:
                      - lambda: "id(ethernet_expected) = false;"
                    else:
                      # Guard: if the cable vanished during the wait, leave
                      # WiFi alone — it is the only path left.
                      - if:
                          condition:
                            ethernet.connected:
                          then:
                            - script.execute: wifi_release_radio
        else:
          # WiFi-silent boot (ethernet_expected): stays off.
          - lambda: "id(ethernet_expected) = true;"
    - component.update: update_http_request
  on_disconnect:
    # Cable gone: make sure WiFi is up so the device rejoins a saved network
    # or, with none configured, opens the provisioning hotspot.
    - lambda: "id(ethernet_expected) = false;"
    - wifi.enable:

wifi:
  id: wifi_1
  on_connect:
    # Remember that working credentials exist: gates the recovery probe
    # below so it never runs (and can never pop the hotspot) on a device
    # that was never provisioned. Survives reboots; factory reset clears it.
    - lambda: "id(wifi_provisioned) = true;"
    - component.update: update_http_request
  on_disconnect:
    # WiFi lost its network while Ethernet carries the device: after a grace
    # period for reassociation, turn WiFi off rather than let the fallback
    # hotspot appear (ap_timeout is 90s; deciding at 60s keeps it from ever
    # starting). Harmless when triggered by wifi.disable itself — the
    # wifi.enabled check below skips the release then.
    - if:
        condition:
          ethernet.connected:
        then:
          - wait_until:
              condition:
                wifi.connected:
              timeout: 60s
          - if:
              condition:
                and:
                  - wifi.enabled:
                  - not:
                      wifi.connected:
                  - ethernet.connected:
              then:
                - script.execute: wifi_release_radio
  # Workaround: roam scans drop active audio
  post_connect_roaming: false
  ap:
    ssid: "Apollo CAST 1 Hotspot"
  power_save_mode: none

captive_portal:
  id: captive_portal_1

improv_serial:
  id: improv_serial_1

esp32_improv:
  id: esp32_improv_1
  authorizer: none

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

# BT allocs in PSRAM; RAM free for audio
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:
  id: bluetooth_proxy_1

api:
  id: api_1
  encryption:

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: testCycleCount
    type: int
    restore_value: no
    initial_value: "0"
  - id: announcement_triggered
    type: bool
    initial_value: 'false'
  # True when WiFi was released while Ethernet carried the device (WiFi had
  # nothing to offer); the next boot then starts WiFi-silent. Cleared when
  # the cable is lost, Ethernet fails to appear at boot, or the device goes
  # dual-homed.
  - id: ethernet_expected
    type: bool
    restore_value: yes
    initial_value: 'false'
  # True once WiFi has ever connected (credentials known-good). Gates the
  # WiFi recovery probe. Cleared only by factory reset.
  - id: wifi_provisioned
    type: bool
    restore_value: yes
    initial_value: 'false'

psram:
  id: psram_1
  mode: octal
  speed: 80MHz
  # Guarantee PSRAM; unlocks fast network tier
  ignore_not_found: false

web_server:
  id: web_server_1
  port: 80
  version: 3

http_request:
  id: http_request_1
  verify_ssl: true
  # Fits GitHub's ~3.6KB CSP redirect header
  buffer_size_rx: 5120
  # Fits GitHub's long signed redirect URL
  buffer_size_tx: 2048

i2c:
  sda: GPIO47
  scl: GPIO48
  id: bus_a

button:
  - platform: restart
    id: restart_button
    icon: mdi:power-cycle
    name: "ESP Reboot"
  - platform: template
    name: "Firmware Update"
    id: update_firmware
    icon: mdi:cloud-download
    entity_category: config
    on_press:
      - logger.log: "Applying firmware update for the selected channel"
      - delay: 3s
      - script.execute: apply_ota_source
      - script.wait: apply_ota_source
      # Give async manifest fetch time to land
      - delay: 5s
      - lambda: id(update_http_request).perform(true);

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected

  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();
    on_release:
      then:
        - lambda: |-
            if (millis() - id(button_press_timestamp) >= 8000) {
              id(factory_reset_switch).turn_on();
            }
            else if (millis() - id(button_press_timestamp) >= 1000) {
              // StatusCheck
              id(statusCheck).execute();
              delay(3000);
              id(testCycleCount) = 0;
              id(runTest) = true;
              id(testScript).execute();
            }

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    disabled_by_default: true

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

switch:
  - platform: factory_reset
    disabled_by_default: True
    name: "Factory Reset ESP"
    id: factory_reset_all

  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "Ethernet IP Address"
      id: eth_ip
      entity_category: "diagnostic"

  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
      entity_category: "diagnostic"

  - platform: sendspin
    id: sendspin_track_title
    type: title
    name: Track Title

  - platform: sendspin
    id: sendspin_artist
    type: artist
    name: Artist

  - platform: sendspin
    id: sendspin_album
    type: album
    name: Album

  - platform: version
    id: esphome_version_sensor
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: "diagnostic"

  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO4
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 4
    rgb_order: grb
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 1000ms
          update_interval: 1000ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

select:
  - platform: template
    id: firmware_channel
    name: "Firmware Channel"
    icon: "mdi:source-branch"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "Stable"
    on_value:
      then:
        - script.execute: apply_ota_source

audio_dac:
  - platform: pcm5122
    id: external_dac
    i2c_id: bus_a
    address: 0x4D
    bits_per_sample: 16bit

i2s_audio:
- id: i2s_out
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO14
  
speaker:
  - platform: i2s_audio
    id: i2s_speaker_id
    i2s_audio_id: i2s_out
    sample_rate: 48000
    i2s_dout_pin: GPIO9
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: i2s_speaker_id
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never

  # Hot audio tasks: stacks stay in internal RAM
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixer_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixer_input
    sample_rate: 48000
    bits_per_sample: 16


sendspin:
  id: sendspin_hub
  # PSRAM stack skews time sync; keep internal
  task_stack_in_psram: false

media_source:
  - platform: sendspin
    id: sendspin_source
    # decode_memory: component default

  - platform: audio_http
    id: http_media_source
    buffer_size: 500000

  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    name: "Sendspin Player"

  - platform: speaker_source
    id: external_media_player
    name: "Player"
    volume_increment: 0.05

    announcement_pipeline:
      format: FLAC     # Least CPU-intensive codec
      num_channels: 1  # Mono suffices for announcements
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - http_announcement_source

    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC     # Least CPU-intensive codec
      num_channels: 2
      sample_rate: 48000
      sources:
        - sendspin_source
        - http_media_source

    on_announcement:
      - if:
          condition:
            - lambda: return (!id(announcement_triggered));
          then:
            - lambda: id(announcement_triggered) = true;
            - light.turn_on:
                id: rgb_light
                blue: 100%
                red: 0%
                green: 100%
                brightness: 50%
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 40
                duration: 0.0s
            - wait_until:
                media_player.is_announcing: external_media_player
            - wait_until:
                - not:
                    media_player.is_announcing: external_media_player
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 0
                duration: 1.0s
            - light.turn_off:
                id: rgb_light
            - lambda: id(announcement_triggered) = false;

    on_state:
      # pcm5122 boots muted; unmute (idempotent)
      - audio_dac.mute_off: external_dac
      - if:
          condition:
            and:
              - lambda: return (!id(announcement_triggered));
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 0
                duration: 1.0s





# A released WiFi (router outage while dual-homed, or slow association at
# cable-connect) must not stay silent until the next cable pull: while
# Ethernet is up and the device has known-good credentials, retry WiFi
# periodically. The 60s bound stays under the 90s hotspot timer (which
# restarts at wifi.enable), so the probe can never broadcast the AP.
interval:
  - id: wifi_recovery_interval
    interval: 10min
    then:
      - if:
          condition:
            and:
              - ethernet.connected:
              - not:
                  wifi.enabled:
              - lambda: "return id(wifi_provisioned);"
          then:
            - script.execute: wifi_recovery_probe

script:
  - id: wifi_recovery_probe
    # Re-attempt WiFi while Ethernet carries the device; rejoin restores
    # dual-home, failure releases the radio again for ESP-NOW.
    then:
      - wifi.enable:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: "id(ethernet_expected) = false;"
          else:
            - if:
                condition:
                  ethernet.connected:
                then:
                  - script.execute: wifi_release_radio

  - id: wifi_release_radio
    # Turn WiFi off while Ethernet carries the device: ends AP+STA, shuts
    # down the captive portal (wifi.disable leaves it answering DNS and
    # /wifisave on the Ethernet IP), and bounces ESP-NOW so it re-inits
    # standalone for the WizMote (the channel scan in wizmote.yaml takes
    # over). ethernet_expected persists so the next boot starts WiFi-silent.
    #
    # If the fallback hotspot is LIVE, reboot instead: ESPHome cannot
    # relaunch a once-started AP within the same boot (ap_setup_ latch), so
    # merely disabling WiFi would leave the next cable-out provisioning
    # attempt with a half-dead hotspot (SSID joins, but 192.168.4.1 serves
    # nothing — observed on hardware). The reboot lands Ethernet-only in
    # seconds with the latch cleared, and happens at most once per setup.
    then:
      - lambda: "id(ethernet_expected) = true;"
      - if:
          condition:
            wifi.ap_active:
          then:
            - lambda: |-
                ESP_LOGW("network", "Rebooting to fully release the active hotspot (one-time)");
            - delay: 500ms
            - lambda: "App.safe_reboot();"
          else:
            - wifi.disable:
            - lambda: |-
                if (id(captive_portal_1).is_active()) {
                  id(captive_portal_1).end();
                }
                id(espnow_component).disable();
                id(espnow_component).enable();

  - id: apply_ota_source
    # Set OTA manifest from the channel selector
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          std::string url = beta
            ? "${beta_manifest_base}/${beta_manifest_file}"
            : "${stable_manifest_base}/${stable_manifest_dir}/manifest.json";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url.c_str());
          id(update_http_request).set_source_url(url);
      - component.update: update_http_request
  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on: 
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
      - delay: 5s
      - light.turn_off: rgb_light
  
  - id: testScript
    then:
      if: 
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - lambda: "id(testCycleCount) = 0;"
          - delay: 2s
          - while:
              condition:
                - lambda: "return id(testCycleCount) < 5;"
              then:
                - lambda: "id(runTest) = false;"
                - delay: 1s
                - lambda: "id(testCycleCount) += 1;"

          ## TODO: Update
          - if:
              condition:
                - lambda: "return true;"
              then:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 100%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light
                
              else:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 100%
                    green: 0%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light
