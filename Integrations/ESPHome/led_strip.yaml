    id: led_strip_color_order
    name: "LED Strip Color Order"
    icon: mdi:palette
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 22
    optimistic: true
    restore_value: true
    options:
      - "GRB"
      - "RGB"
      - "BRG"
      - "RBG"
      - "GBR"
      - "BGR"
    initial_option: "GRB"
    set_action:
      - script.execute:
          id: led_strip_apply_color_order
          order: !lambda "return std::string(x);"

  - platform: template
    id: led_strip_chipset
    name: "LED Strip Chipset"
    icon: mdi:chip
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 23
    optimistic: true
    restore_value: true
    options:
      - "WS2812"
      - "SK6812"
      - "WS2811"
      - "APA106"
      - "SM16703"
    initial_option: "WS2812"
    set_action:
      - script.execute:
          id: led_strip_apply_chipset
          chipset: !lambda "return std::string(x);"

  - platform: template
    id: led_strip_music_effect
