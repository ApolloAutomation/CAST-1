# LED strip on the exposed 5V / GND / IO1 header; included by Core.yaml

esphome:
  on_boot:
    # Apply the saved LED strip settings before the light's first write
    # Must run after the strip and the restored entities set up (800)
    - priority: 600
      then:
        - lambda: |-
            id(led_strip_output)->set_num_leds((uint16_t) id(led_strip_count).state);
        - script.execute: led_strip_blank_all
        - script.execute:
            id: led_strip_apply_color_order
            order: !lambda "return std::string(id(led_strip_color_order).current_option());"
        - script.execute:
            id: led_strip_apply_chipset
            chipset: !lambda "return std::string(id(led_strip_chipset).current_option());"
        - script.execute:
            id: led_strip_apply_max_brightness
            percent: !lambda "return id(led_strip_max_brightness).state;"

# Every LED strip entity sits under one header on the device's web page
web_server:
  sorting_groups:
    - id: sg_led_strip
      name: "External LED Strip"
      sorting_weight: 10

light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    output_id: led_strip_output
    name: "LED Strip"
    icon: mdi:led-strip-variant
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 1
    pin: GPIO1
    # Timings and color order are swapped at runtime by the select entities
    chipset: WS2812
    channel_colors: GRB
    num_leds: 300
    # The rest of the RMT TX memory after the onboard light's 48
    rmt_symbols: 144
    # The RMT interrupt refills from these buffers mid-frame; PSRAM reads can
    # stall it under audio load and cut the frame short
    use_psram: false
    default_transition_length: 1s
    restore_mode: RESTORE_DEFAULT_OFF
    # Re-send the settled frame once, and clear the whole strip after turn-off
    on_state:
      - script.execute: led_strip_refresh
    # New effects go at the end: the light restores its effect by position
    effects:
      - addressable_rainbow:
          name: "Rainbow"
      - addressable_color_wipe:
          name: "Color Wipe"
      - addressable_scan:
          name: "Scan"
      - addressable_twinkle:
          name: "Twinkle"
      - addressable_random_twinkle:
          name: "Random Twinkle"
      - addressable_fireworks:
          name: "Fireworks"
      - addressable_flicker:
          name: "Flicker"
      - pulse:
          name: "Pulse"
      - strobe:
          name: "Strobe"

      # Effect A and Effect B run the pattern their Pattern select picks, at
      # their own Speed and Intensity, on the segments whose switch is on
      - addressable_lambda:
          name: "Effect A"
          # About one frame per main-loop pass (~16 ms); the lambda keeps its
          # own clock, so this only caps how often the strip is re-sent
          update_interval: 15ms
          lambda: &led_strip_slot_effect |-
            // Effect A and Effect B share this body; each copy keeps its own statics
            static float level[8];
            static float target[8];
            static uint32_t next_ms = 0;
            static uint32_t cycle_start = 0;
            const uint32_t now = millis();

            const bool slot_b = strcmp(id(led_strip).get_effect_name().c_str(), "Effect B") == 0;
            // Each template select is its own type (it carries its initial option),
            // so pick through the shared base classes
            select::Select *pattern = slot_b ? static_cast<select::Select *>(id(led_strip_effect_b_pattern))
                                             : static_cast<select::Select *>(id(led_strip_effect_a_pattern));
            number::Number *speed_num = slot_b ? static_cast<number::Number *>(id(led_strip_effect_b_speed))
                                               : static_cast<number::Number *>(id(led_strip_effect_a_speed));
            number::Number *intensity_num = slot_b ? static_cast<number::Number *>(id(led_strip_effect_b_intensity))
                                                   : static_cast<number::Number *>(id(led_strip_effect_a_intensity));
            const float speed = clamp(speed_num->state, 1.0f, 100.0f);
            const float intensity = clamp(intensity_num->state / 100.0f, 0.0f, 1.0f);
            // Speed 1-100 on a log curve: 1 = 1000 ms, 50 = 176 ms, 100 = 30 ms
            const uint32_t period = (uint32_t) (1000.0f * powf(0.03f, (speed - 1.0f) / 99.0f));

            if (initial_run) {
              for (auto &l : level) l = 1.0f;
              for (auto &t : target) t = 1.0f;
              next_ms = now;
              cycle_start = now;
            }

            // Split the strip into segments; the last one takes the leftover LEDs
            const int32_t n = it.size();
            if (n <= 0) return;
            const int32_t segs = std::max<int32_t>(1, std::min<int32_t>((int32_t) id(led_strip_segments).state,
                                                                        std::min<int32_t>(8, n)));
            const int32_t base = n / segs;
            const bool seg_on[8] = {id(led_strip_segment_1).state, id(led_strip_segment_2).state,
                                    id(led_strip_segment_3).state, id(led_strip_segment_4).state,
                                    id(led_strip_segment_5).state, id(led_strip_segment_6).state,
                                    id(led_strip_segment_7).state, id(led_strip_segment_8).state};

            if (pattern->active_index().value_or(0) == 1) {
              // Strobe: one flash every 2 x period, lit for the Intensity share of it
              const uint32_t cycle = period * 2;
              if (now - cycle_start >= cycle) cycle_start = now - (now - cycle_start) % cycle;
              const uint32_t on_ms = (uint32_t) (cycle * clamp(intensity, 0.05f, 0.95f));
              const Color c = (now - cycle_start) < on_ms ? current_color : Color::BLACK;
              for (int32_t s = 0; s < segs; s++) {
                const int32_t from = s * base;
                const int32_t to = (s == segs - 1) ? n : from + base;
                it.range(from, to) = seg_on[s] ? c : Color::BLACK;
              }
            } else {
              // Flicker: every period each segment picks a new random level, no
              // lower than 1 - Intensity, and eases toward it within a few frames
              const int32_t late = (int32_t) (now - next_ms);
              // A raised Speed pulls in a change that was scheduled further out
              if (late >= 0 || -late > (int32_t) period) {
                for (int32_t s = 0; s < segs; s++) target[s] = 1.0f - intensity * random_float();
                next_ms = (late >= 0 && late < (int32_t) period) ? next_ms + period : now + period;
              }
              for (int32_t s = 0; s < segs; s++) {
                level[s] += (target[s] - level[s]) * 0.6f;
                const int32_t from = s * base;
                const int32_t to = (s == segs - 1) ? n : from + base;
                it.range(from, to) = seg_on[s] ? current_color * (uint8_t) (level[s] * 255.0f) : Color::BLACK;
              }
            }
      - addressable_lambda:
          name: "Effect B"
          update_interval: 15ms
          lambda: *led_strip_slot_effect

      # Solid color on each segment whose switch is on; a plain color paints
      # every LED, so the segment switches move the strip onto this effect
      - addressable_lambda:
          name: "Segments"
          update_interval: 50ms
          lambda: |-
            const int32_t n = it.size();
            if (n <= 0) return;
            const int32_t segs = std::max<int32_t>(1, std::min<int32_t>((int32_t) id(led_strip_segments).state,
                                                                        std::min<int32_t>(8, n)));
            const int32_t base = n / segs;
            const bool seg_on[8] = {id(led_strip_segment_1).state, id(led_strip_segment_2).state,
                                    id(led_strip_segment_3).state, id(led_strip_segment_4).state,
                                    id(led_strip_segment_5).state, id(led_strip_segment_6).state,
                                    id(led_strip_segment_7).state, id(led_strip_segment_8).state};
            for (int32_t s = 0; s < segs; s++) {
              const int32_t from = s * base;
              const int32_t to = (s == segs - 1) ? n : from + base;
              it.range(from, to) = seg_on[s] ? current_color : Color::BLACK;
            }

number:
  - platform: template
    id: led_strip_count
    name: "LED Strip Count"
    icon: mdi:counter
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 20
    mode: box
    min_value: 1
    max_value: 300
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 30
    set_action:
      - script.execute:
          id: led_strip_apply_count
          count: !lambda "return (int) x;"

  # Caps every channel so a long strip can't overdraw the header's 5V rail
  - platform: template
    id: led_strip_max_brightness
    name: "LED Strip Max Brightness"
    icon: mdi:brightness-percent
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 21
    unit_of_measurement: "%"
    mode: slider
    min_value: 10
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 50
    set_action:
      - script.execute:
          id: led_strip_apply_max_brightness
          percent: !lambda "return x;"

  # How many equal segments the strip splits into; Segment switches past this
  # count do nothing
  - platform: template
    id: led_strip_segments
    name: "LED Strip Segments"
    icon: mdi:view-split-vertical
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 2
    mode: box
    min_value: 1
    max_value: 8
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 1
    on_value:
      - script.execute: led_strip_segments_changed

  # Speed 1-100 maps on a log curve from 1 s (1) to 30 ms (100) between changes
  - platform: template
    id: led_strip_effect_a_speed
    name: "LED Strip Effect A Speed"
    icon: mdi:speedometer
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 12
    mode: slider
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 50

  # Flicker: how far a segment can dip (0 = steady); Strobe: share of each
  # flash the strip is lit
  - platform: template
    id: led_strip_effect_a_intensity
    name: "LED Strip Effect A Intensity"
    icon: mdi:tune-vertical
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 13
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 70

  - platform: template
    id: led_strip_effect_b_speed
    name: "LED Strip Effect B Speed"
    icon: mdi:speedometer
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 15
    mode: slider
    min_value: 1
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 80

  - platform: template
    id: led_strip_effect_b_intensity
    name: "LED Strip Effect B Intensity"
    icon: mdi:tune-vertical
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 16
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 50

select:
