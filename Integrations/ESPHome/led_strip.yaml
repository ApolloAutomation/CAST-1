    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: led_strip_segments_changed
    on_turn_off:
      - script.execute: led_strip_segments_changed

  - platform: template
    id: led_strip_segment_6
    name: "LED Strip Segment 6"
