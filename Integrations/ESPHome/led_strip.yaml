    options:
      - "Rainbow"
      - "Color Wipe"
      - "Scan"
      - "Twinkle"
      - "Random Twinkle"
      - "Fireworks"
      - "Flicker"
      - "Pulse"
    initial_option: "Rainbow"

  # Patterns for the Effect A / Effect B slots; the slot effect picks the
  # pattern by position, so new patterns go at the end
  - platform: template
    id: led_strip_effect_a_pattern
    name: "LED Strip Effect A Pattern"
    icon: mdi:animation-play
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 11
    optimistic: true
    restore_value: true
    options:
      - "Flicker"
      - "Strobe"
    initial_option: "Flicker"

  - platform: template
    id: led_strip_effect_b_pattern
    name: "LED Strip Effect B Pattern"
    icon: mdi:animation-play
    entity_category: config
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 14
    optimistic: true
    restore_value: true
    options:
      - "Flicker"
      - "Strobe"
    initial_option: "Strobe"

switch:
  # Music Mode: the strip turns on with the Music Effect while audio plays and
  # off once playback has stopped for 10s
  - platform: template
    id: led_strip_music_mode
    name: "LED Strip Music Mode"
    icon: mdi:music-note
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 25
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            binary_sensor.is_on: led_strip_music_playing
          then:
            - script.execute: led_strip_music_start
    on_turn_off:
      - if:
          condition:
            binary_sensor.is_on: led_strip_music_playing
          then:
            - light.turn_off: led_strip

  # Segment switches: Effect A, Effect B and Segments leave a segment dark
  # while its switch is off
  - platform: template
    id: led_strip_segment_1
    name: "LED Strip Segment 1"
    icon: mdi:led-strip
    web_server:
      sorting_group_id: sg_led_strip
      sorting_weight: 3
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: led_strip_segments_changed
    on_turn_off:
      - script.execute: led_strip_segments_changed

  - platform: template
    id: led_strip_segment_2
