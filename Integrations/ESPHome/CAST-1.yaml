esphome:
  name: "apollo-cast-1"
  friendly_name: Apollo CAST-1
  comment: Apollo CAST-1
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio

  project:
    name: "ApolloAutomation.CAST-1"
    version: ${version}

  # Multi-interface (network: priority:) shipped in 2026.8.0
  min_version: 2026.8.0

  on_boot:
    - priority: 800
      then:
        - if:
            condition:
              - lambda: "return id(runTest);"
            then:
              - lambda: "id(testScript).execute();"
    - priority: 500
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"

dashboard_import:
  package_import_url: github://ApolloAutomation/CAST-1/Integrations/ESPHome/CAST-1.yaml
  import_full_config: false

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

safe_mode:
  id: safe_mode_1

improv_serial:
  id: improv_serial_1

esp32_improv:
  id: esp32_improv_1
  authorizer: none

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: https://apolloautomation.github.io/CAST-1/firmware/manifest.json

logger:
  id: logger_1

network:
  priority:
    - ethernet
    - wifi

ethernet:
  id: ethernet_1
  type: W5500
  clock_speed: 40MHz
  clk_pin: GPIO7
  mosi_pin: GPIO12
  miso_pin: GPIO11
  cs_pin: GPIO6
  interrupt_pin: GPIO13
  reset_pin: GPIO21
  # Wired install: silence the wifi radio (no hotspot, and the WizMote
  # channel scan needs the radio free). Unplugging brings wifi back.
  on_connect:
    - lambda: "id(ethernet_active) = true;"
    - wifi.disable:
    - component.update: update_http_request
  on_disconnect:
    - lambda: "id(ethernet_active) = false;"
    - wifi.enable:

wifi:
  id: wifi_1
  on_connect:
    - component.update: update_http_request
  # Workaround: roam scans drop active audio
  post_connect_roaming: false
  # Wifi stays disabled indefinitely on wired installs; a nonzero value
  # would reboot them. Hung devices are still covered by api reboot_timeout.
  reboot_timeout: 0s
  ap:
    ssid: "Apollo CAST 1 Hotspot"
  power_save_mode: none

captive_portal:
  id: captive_portal_1

globals:
  - id: ethernet_active
    type: bool
    restore_value: no
    initial_value: "false"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
      entity_category: "diagnostic"
  - platform: ethernet_info
    ip_address:
      name: "Ethernet IP Address"
      id: eth_ip
      entity_category: "diagnostic"

# Wired installs have no wifi channel to follow: scan until WizMote heard
interval:
  - id: wizmote_channel_scan
    interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(ethernet_active)) return false;
              std::string mac = id(wizmote_mac_address).state;
              bool want = id(wizmote_discovery_mode).state ||
                          (mac != "00:00:00:00:00:00" && mac != "");
              return want && (millis() - id(wizmote_last_packet_ms) > 30000);
          then:
            - lambda: |-
                id(wizmote_scan_channel)++;
                if (id(wizmote_scan_channel) > 13) id(wizmote_scan_channel) = 1;
            - espnow.set_channel:
                channel: !lambda 'return id(wizmote_scan_channel);'
            - logger.log:
                format: "WizMote channel scan: trying channel %d"
                args: ['id(wizmote_scan_channel)']

packages:
  core: !include Core.yaml
