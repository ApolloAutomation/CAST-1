# Legacy Ethernet-variant shim. The firmware is identical to CAST-1.yaml
# (WiFi + Ethernet in one image); only the device/project name and the OTA
# manifest URLs differ, so devices originally flashed with the Ethernet
# firmware keep updating from their original manifest without a reflash.
# New installs should use CAST-1.yaml.

substitutions:
  stable_manifest_dir: "firmware-e"
  beta_manifest_file: "manifest-e.json"

esphome:
  name: "apollo-cast-1-eth"
  project:
    name: "ApolloAutomation.CAST-1-ETH"
    version: ${version}

dashboard_import:
  package_import_url: github://ApolloAutomation/CAST-1/Integrations/ESPHome/CAST-1_ETH.yaml
  import_full_config: false

packages:
  core: !include Core.yaml
