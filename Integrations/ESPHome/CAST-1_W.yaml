# Legacy WiFi-variant shim. The firmware is identical to CAST-1.yaml
# (WiFi + Ethernet in one image); only the device/project name and the OTA
# manifest URLs differ, so devices originally flashed with the WiFi firmware
# keep updating from their original manifest without a reflash.
# New installs should use CAST-1.yaml.

substitutions:
  stable_manifest_dir: "firmware-w"
  beta_manifest_file: "manifest-w.json"

esphome:
  name: "apollo-cast-1-w"
  project:
    name: "ApolloAutomation.CAST-1-W"
    version: ${version}

dashboard_import:
  package_import_url: github://ApolloAutomation/CAST-1/Integrations/ESPHome/CAST-1_W.yaml
  import_full_config: false

packages:
  core: !include Core.yaml
