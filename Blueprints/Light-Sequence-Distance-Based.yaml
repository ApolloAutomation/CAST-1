blueprint:
  name: Light Sequence (Distance-Based)
  description: >-
    Lights a path in stages as a visitor walks toward the door, using one
    radar distance reading instead of separate zones. Made for LD2410 and
    LD2412 style sensors (an Apollo R PRO-1, for example) mounted by the door
    and facing out, so the distance shrinks as a visitor walks up.


    Each stage turns on when the visitor comes within its distance, and the
    earlier stages stay on. Coming within the finale distance switches every
    lit light to the finale look, then all of them go to the resting state.
    If the visitor doesn't get closer in time, the lit lights go to the
    resting state early.


    Stages only advance toward the door. Someone stepping out of the door and
    walking away doesn't start a sequence.


    Works with any Home Assistant lights. Sounds play as announcements, so
    music playing on the same speaker ducks under them instead of stopping.
  domain: automation
  author: Apollo Automation
  homeassistant:
    min_version: 2025.7.0
  input:
    sensor_section:
      name: Radar sensor
      icon: mdi:radar
      collapsed: false
      input:
        distance_sensor:
          name: Distance sensor
          description: >-
            The radar's distance to the visitor. Moving Distance works best,
            since it ignores still objects such as plants or a parked car.
            Detection Distance also works. The distances you enter below use
            this sensor's unit (in, cm, ft or m), whatever it shows in Home Assistant.
          # Any sensor: many radars' distance entities, such as the R PRO-1's
          # LD2412 ones, have no distance device class
          selector:
            entity:
              filter:
                - domain: sensor
        presence_sensor:
          name: Target sensor (recommended)
          description: >-
            On while the radar sees anyone, moving or still, such as the
            radar's Presence or Target sensor. It tells a visitor walking up
            apart from a distance left over by someone earlier, and distances
            only move a sequence forward while it's on. Without it, a reading
            of 0 counts as nobody there, and the reading just before a
            visitor crosses the first stage must be at most 30 s old.
          default: ""
          selector:
            entity:
              filter: &target_filter
                - domain: binary_sensor
                  device_class:
                    - occupancy
                    - presence
                    - motion

    stages_section:
      name: Stages
      icon: mdi:walk
      collapsed: false
      input:
        stages:
          name: Stages
          description: >-
            Add one stage per light group. Each stage turns on when the
            visitor comes within its distance of the sensor, in the sensor's
            unit (inches or cm, for example). The stage with the largest distance starts the
            sequence, so the order you add them in doesn't matter. A sequence
            starts when a visitor walks in across that distance, so keep it a
            little inside the radar's range, where it can see them coming.


            LD2410 sensors measure in gates of about 75 cm (30 in), so space the
            stages at least a gate apart; 150 cm (60 in) or more is more reliable. If
            a visitor passes several stages between readings, those stages
            turn on together.


            Each stage uses the shared Stage look and Stage sound unless you
            set its own color, brightness, effect or sound.
          default: []
          selector:
            object:
              multiple: true
              label_field: distance
              fields:
                distance:
                  label: Turns on within this distance (in the sensor's unit)
                  required: true
                  selector:
                    number: &distance_select
                      min: 0
                      max: 10000
                      step: any
                      mode: box
                lights:
                  label: Lights
                  required: true
                  selector:
                    entity:
                      multiple: true
                      filter:
                        - domain: light
                sound:
                  label: Sound (leave empty for the shared Stage sound)
                  selector:
                    media:
                color_mode:
                  label: Color (leave empty for the Stage look)
                  selector:
                    select: &color_mode_select
                      mode: dropdown
                      options:
                        - label: RGB color
                          value: rgb
                        - label: Color temperature (white)
                          value: kelvin
                        - label: Don't change the color
                          value: none
                rgb:
                  label: RGB color
                  selector:
                    color_rgb:
                kelvin:
                  label: Color temperature
                  selector:
                    color_temp: &kelvin_select
                      unit: kelvin
                      min: 2000
                      max: 6500
                brightness:
                  label: Brightness (leave empty for the Stage look)
                  selector:
                    number: &brightness_select
                      min: 1
                      max: 100
                      step: 1
                      unit_of_measurement: "%"
                      mode: slider
                effect:
                  label: Effect (leave empty for the Stage look)
                  selector:
                    select: &effect_select
                      mode: dropdown
                      custom_value: true
                      options:
                        - None
                        - Flicker
                        - Pulse
                        - Strobe
                        - Rainbow
                        - Color Wipe
                        - Scan
                        - Twinkle
                        - Random Twinkle
                        - Fireworks
                        - Effect A
                        - Effect B
                        - candle
                        - fire
                        - prism
                        - sparkle
                        - opal
                        - glisten
                        - underwater
                        - cosmos
                        - sunbeam
                        - enchant

    finale_section:
      name: Finale
      icon: mdi:door
      collapsed: false
      input:
        finale_distance:
          name: Finale distance
          description: >-
            Coming within this distance of the sensor plays the finale. Use
            the sensor's unit and keep it below every stage distance.
          default: 40
          selector:
            number: *distance_select
        finale_extra_lights:
          name: Extra finale lights (optional)
          description: >-
            Lights that join the finale on top of the stage lights, such as a
            porch light.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
        finale_duration:
          name: Finale length
          description: How long the finale look stays on before the resting state.
          default: 10
          selector:
            number:
              min: 1
              max: 300
              step: 1
              unit_of_measurement: s
              mode: box
        finale_sound:
          name: Finale sound (optional)
          default: {}
          selector:
            media:
        finale_color_mode:
          name: Finale color
          default: rgb
          selector:
            select: *color_mode_select
        finale_rgb:
          name: Finale RGB color
          description: Used when the color is set to RGB color.
          default: [0, 0, 255]
          selector:
            color_rgb:
        finale_kelvin:
          name: Finale color temperature
          description: Used when the color is set to Color temperature.
          default: 3000
          selector:
            color_temp: *kelvin_select
        finale_brightness:
          name: Finale brightness
          default: 80
          selector:
            number: *brightness_select
        finale_effect:
          name: Finale effect
          description: &effect_description >-
            Pick one or type the name exactly as the light lists it. Each light
            only gets an effect it supports; the others just change color and
            brightness. None stops a running effect. Strobe-style effects
            faster than 3 flashes per second can trigger seizures in people
            with photosensitive epilepsy.
          default: Pulse
          selector:
            select: *effect_select

    stage_look_section:
      name: Stage look and sound
      icon: mdi:palette
      description: How every stage looks and sounds, unless the stage sets its own.
      collapsed: true
      input:
        stage_color_mode:
          name: Stage color
          default: rgb
          selector:
            select: *color_mode_select
        stage_rgb:
          name: Stage RGB color
          description: Used when the color is set to RGB color.
          default: [255, 100, 0]
          selector:
            color_rgb:
        stage_kelvin:
          name: Stage color temperature
          description: Used when the color is set to Color temperature.
          default: 3000
          selector:
            color_temp: *kelvin_select
        stage_brightness:
          name: Stage brightness
          default: 75
          selector:
            number: *brightness_select
        stage_effect:
          name: Stage effect
          description: *effect_description
          default: Flicker
          selector:
            select: *effect_select
        stage_sound:
          name: Stage sound (optional)
          description: Played each time a stage turns on, unless the stage has its own sound.
          default: {}
          selector:
            media:

    end_section:
      name: Resting state
      icon: mdi:sleep
      description: What the lights do after the finale, or after a visitor turns back.
      collapsed: true
      input:
        end_mode:
          name: Resting state
          default: "off"
          selector:
            select:
              options:
                - label: Turn off
                  value: "off"
                - label: Show the resting look below
                  value: look
                - label: Go back to how they were before the sequence
                  value: restore
        abandon_sound:
          name: Turned-back sound (optional)
          description: Played when a visitor leaves before reaching the finale.
          default: {}
          selector:
            media:
        end_color_mode:
          name: Resting color
          default: kelvin
          selector:
            select: *color_mode_select
        end_rgb:
          name: Resting RGB color
          description: Used when the color is set to RGB color.
          default: [255, 160, 60]
          selector:
            color_rgb:
        end_kelvin:
          name: Resting color temperature
          description: Used when the color is set to Color temperature.
          default: 2700
          selector:
            color_temp: *kelvin_select
        end_brightness:
          name: Resting brightness
          default: 40
          selector:
            number: *brightness_select
        end_effect:
          name: Resting effect
          description: *effect_description
          default: None
          selector:
            select: *effect_select

    timing_section:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        step_timeout:
          name: Time to reach the next stage
          description: >-
            After each stage turns on, the visitor has this long to come
            within a later stage's distance. If they don't, the lit lights go
            to the resting state.
          default: 30
          selector:
            number:
              min: 5
              max: 600
              step: 1
              unit_of_measurement: s
              mode: box
        cooldown:
          name: Cooldown
          description: After a sequence ends, wait this long before another can start.
          default: 10
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
              mode: box
        transition:
          name: Transition
          description: Fade time when lights change. 0 changes them instantly.
          default: 0
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: s
              mode: box
        sound_delay:
          name: Light delay after a sound
          description: >-
            Speakers take a moment to start a sound. When a step has a sound,
            its lights wait this long after the sound is sent so the two land
            together. Tune it by ear; 0 changes the lights right away.
          default: 0
          selector:
            number:
              min: 0
              max: 3000
              step: 50
              unit_of_measurement: ms
              mode: slider

    options_section:
      name: Sound player and options
      icon: mdi:cog
      collapsed: true
      input:
        sound_player:
          name: Sound player
          description: >-
            Plays every sound. Leave empty to use the player each sound was
            picked from. With Music Assistant, pick the speaker's own player
            rather than the Music Assistant one, so music ducks under the
            sound instead of pausing.
          default: ""
          selector:
            entity:
              filter:
                - domain: media_player
        set_volume:
          name: Set the volume during a sequence
          description: >-
            Sets the sound player's volume when a sequence starts and puts it
            back when the sequence ends. This is the player's only volume, so
            music playing on it changes too. Needs a Sound player above.
          default: false
          selector:
            boolean:
        sound_volume:
          name: Sequence volume
          default: 60
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        enable_entity:
          name: Enable switch (optional)
          description: >-
            Sequences only start while this is on, for example a Halloween
            mode toggle. Leave empty to always run.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - switch
                    - binary_sensor
        pause_entities:
          name: Switches to pause during a sequence (optional)
          description: >-
            Turned off while a sequence runs and back on afterwards if they
            were on, for example a CAST-1's LED Strip Music Mode, which
            otherwise takes over the strip when music starts or stops.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - switch
                    - input_boolean

mode: single
max_exceeded: silent

triggers:
  # Every new distance reading; the conditions decide whether it starts one
  - trigger: state
    entity_id: !input distance_sensor

variables:
  stage_inputs: !input stages
  dist_sensor: !input distance_sensor
  presence_sensor: !input presence_sensor
  finale_distance: !input finale_distance
  finale_extra_lights: !input finale_extra_lights
  finale_sound: !input finale_sound
  stage_sound: !input stage_sound
  abandon_sound: !input abandon_sound
  end_mode: !input end_mode
  transition_s: !input transition
  sound_delay: !input sound_delay
  sound_player: !input sound_player
  set_volume: !input set_volume
  sound_volume: !input sound_volume
  enable_entity: !input enable_entity
  pause_entities: !input pause_entities
  stage_look:
    color_mode: !input stage_color_mode
    rgb: !input stage_rgb
    kelvin: !input stage_kelvin
    brightness: !input stage_brightness
    effect: !input stage_effect
  finale_look:
    color_mode: !input finale_color_mode
    rgb: !input finale_rgb
    kelvin: !input finale_kelvin
    brightness: !input finale_brightness
    effect: !input finale_effect
  end_look:
    color_mode: !input end_color_mode
    rgb: !input end_rgb
    kelvin: !input end_kelvin
    brightness: !input end_brightness
    effect: !input end_effect
  # Stages with a distance and lights, farthest first, each with its look
  # filled in from the Stage look and its sound resolved to {id, type, player}
  stages: >-
    {%- set ns = namespace(out=[]) -%}
    {%- for s in stage_inputs if s is mapping -%}
      {%- set lights = s.get('lights') or [] -%}
      {%- set lights = [lights] if lights is string else lights | list -%}
      {%- set dist = s.get('distance') | float(0) -%}
      {%- if dist > 0 and lights | count > 0 -%}
        {%- set own_color = s.get('color_mode') not in [none, ''] -%}
        {%- set effect = s.get('effect') -%}
        {%- set look = {
          'color_mode': s.get('color_mode') if own_color else stage_look.color_mode,
          'rgb': s.get('rgb') if own_color and s.get('rgb') else stage_look.rgb,
          'kelvin': s.get('kelvin') if own_color and s.get('kelvin') else stage_look.kelvin,
          'brightness': s.get('brightness') if s.get('brightness') is number else stage_look.brightness,
          'effect': effect if effect is string and effect | trim != '' else stage_look.effect
        } -%}
        {%- set snd = s.get('sound') -%}
        {%- set snd = snd if snd is mapping and snd.get('media_content_id') else stage_sound -%}
        {%- set snd = snd if snd is mapping else {} -%}
        {%- set ns.out = ns.out + [{
          'distance': dist,
          'lights': lights,
          'look': look,
          'sound': {
            'id': snd.get('media_content_id') or '',
            'type': snd.get('media_content_type') or 'music',
            'player': sound_player or snd.get('entity_id') or ''
          }
        }] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.out | sort(attribute='distance', reverse=true) }}
  # light.turn_on data for the finale, resting state and each stage, in that
  # order; the effect is added per light when the look is applied
  look_data: >-
    {%- set ns = namespace(out=[]) -%}
    {%- for l in [finale_look, end_look] + stages | map(attribute='look') | list -%}
      {#- Only send a fade when one is set: ESPHome warns when an effect comes with any transition, even 0 -#}
      {%- set d = {'brightness_pct': l.brightness | int(100)} -%}
      {%- if transition_s | float(0) > 0 -%}
        {%- set d = dict(d, transition=transition_s | float(0)) -%}
      {%- endif -%}
      {%- if l.color_mode == 'rgb' and l.rgb -%}
        {%- set d = dict(d, rgb_color=l.rgb | list) -%}
      {%- elif l.color_mode == 'kelvin' and l.kelvin -%}
        {%- set d = dict(d, color_temp_kelvin=l.kelvin | int) -%}
      {%- endif -%}
      {%- set ns.out = ns.out + [d] -%}
    {%- endfor -%}
    {{ ns.out }}
  all_lights: >-
    {{ (stages | map(attribute='lights') | sum(start=[]) + finale_extra_lights) | unique | list }}
  snapshot_scene: "porch_distance_sequence_{{ this.entity_id.split('.')[1] }}"

conditions:
  - condition: template
    value_template: "{{ enable_entity == '' or is_state(enable_entity, 'on') }}"
  - condition: template
    value_template: "{{ stages | count > 0 and finale_distance | float(0) > 0 }}"
  # Only a visitor walking in starts a sequence: the last reading was beyond
  # the first stage and this one is inside it but short of the finale.
  # Someone appearing at the door or walking away never reads that way. The
  # far reading must also belong to this visitor, not be left over from an
  # earlier one: the target sensor has stayed on since it was taken, or
  # without one, it's at most 30 s old
  - condition: template
    value_template: >-
      {%- set prev = trigger.from_state.state | float(0) if trigger.from_state else 0 -%}
      {%- set cur = trigger.to_state.state | float(0) if trigger.to_state else 0 -%}
      {%- set target = expand([presence_sensor]) | first if presence_sensor != '' else none -%}
      {%- if not trigger.from_state or not trigger.to_state -%}
        {%- set fresh = false -%}
      {%- elif target -%}
        {#- 2 s of slack: the target and distance readings can arrive in either order -#}
        {%- set fresh = target.state == 'on'
            and (target.last_changed - trigger.from_state.last_changed).total_seconds() <= 2 -%}
      {%- else -%}
        {%- set fresh = (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() <= 30 -%}
      {%- endif -%}
      {{ fresh and prev > stages[0].distance and 0 < cur <= stages[0].distance
         and cur > finale_distance | float(0) }}

actions:
  - variables:
      paused: >-
        {{ expand(pause_entities) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
      prev_volume: >-
        {{ state_attr(sound_player, 'volume_level') if set_volume and sound_player != '' else none }}
  - if:
      - condition: template
        value_template: "{{ paused | count > 0 }}"
    then:
      - action: homeassistant.turn_off
        target:
          entity_id: "{{ paused }}"
  - if:
      - condition: template
        value_template: "{{ set_volume and sound_player != '' }}"
    then:
      - action: media_player.volume_set
        target:
          entity_id: "{{ sound_player }}"
        data:
          volume_level: "{{ (sound_volume | float(60)) / 100 }}"
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ end_mode == 'restore' and all_lights | count > 0 }}"
    then:
      - action: scene.create
        data:
          scene_id: "{{ snapshot_scene }}"
          snapshot_entities: "{{ all_lights }}"

  # idx is the last lit stage (-1 before the first); outcome becomes finale
  # or abandon. The first pass lights the first stage without waiting.
  # A reading counts only while it's above 0 and the target sensor is on
  - variables:
      idx: -1
      outcome: ""
  - repeat:
      while:
        - condition: template
          value_template: "{{ outcome == '' }}"
      sequence:
        - wait_template: >-
            {%- set d = states(dist_sensor) | float(0) -%}
            {%- set ok = d > 0 and (presence_sensor == '' or is_state(presence_sensor, 'on')) -%}
            {%- set nxt = stages[idx + 1].distance if idx + 1 < stages | count else finale_distance | float(0) -%}
            {{ idx < 0 or (ok and d <= nxt) }}
          timeout: !input step_timeout
          continue_on_timeout: true
        - variables:
            reading: >-
              {%- set d = states(dist_sensor) | float(0) -%}
              {{ d if d > 0 and (presence_sensor == '' or is_state(presence_sensor, 'on')) else 0 }}
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              sequence:
                - variables:
                    outcome: abandon
            - conditions:
                - condition: template
                  value_template: "{{ idx >= 0 and reading > 0 and reading <= finale_distance | float(0) }}"
              sequence:
                # Skipped stages join the finale directly
                - variables:
                    idx: "{{ stages | count - 1 }}"
                    outcome: finale
          default:
            # Jump to the closest stage the visitor is within, lighting any
            # skipped ones. The first pass always lights at least the first
            - variables:
                target_idx: >-
                  {%- set ns = namespace(j=[idx, 0] | max) -%}
                  {%- if reading > 0 -%}
                    {%- for s in stages -%}
                      {%- if loop.index0 > idx and reading <= s.distance -%}
                        {%- set ns.j = loop.index0 -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {{ ns.j }}
            - if:
                - condition: template
                  value_template: "{{ target_idx > idx }}"
              then:
                - variables:
                    snd: "{{ stages[target_idx].sound }}"
                    jobs: >-
                      {%- set ns = namespace(out=[]) -%}
                      {%- for i in range(idx + 1, target_idx + 1) -%}
                        {%- for l in stages[i].lights -%}
                          {%- set ns.out = ns.out + [{'light': l, 'data': look_data[i + 2], 'effect': stages[i].look.effect}] -%}
                        {%- endfor -%}
                      {%- endfor -%}
                      {{ ns.out }}
                # play_media can hold the run until the sound ends, so the
                # sound gets its own branch and the lights don't wait for it
                - parallel:
                    - if:
                        - condition: template
                          value_template: "{{ snd.id != '' and snd.player != '' }}"
                      then:
                        - action: media_player.play_media
                          target:
                            entity_id: "{{ snd.player }}"
                          data:
                            media_content_id: "{{ snd.id }}"
                            media_content_type: "{{ snd.type }}"
                            announce: true
                          continue_on_error: true
                    - sequence:
                        - if:
                            - condition: template
                              value_template: "{{ snd.id != '' and snd.player != '' }}"
                          then:
                            - delay:
                                milliseconds: "{{ sound_delay | int(0) }}"
                        - repeat: &apply_jobs
                            for_each: "{{ jobs }}"
                            sequence:
                              # The look's effect, matched to the name this light uses
                              # for it; None picks the light's own "None" or "off"
                              - action: light.turn_on
                                target:
                                  entity_id: "{{ repeat.item.light }}"
                                data: >-
                                  {%- set fx = state_attr(repeat.item.light, 'effect_list') or [] -%}
                                  {%- set want = (repeat.item.effect or 'None') | string | trim | lower -%}
                                  {%- set names = ['none', 'off'] if want in ['', 'none', 'off'] else [want] -%}
                                  {%- set ns = namespace(e='') -%}
                                  {%- for f in fx -%}
                                    {%- if ns.e == '' and (f | string | lower) in names -%}
                                      {%- set ns.e = f -%}
                                    {%- endif -%}
                                  {%- endfor -%}
                                  {{ dict(repeat.item.data, effect=ns.e) if ns.e else repeat.item.data }}
                                continue_on_error: true
                - variables:
                    idx: "{{ target_idx }}"

  - variables:
      lit_lights: >-
        {{ stages[:idx + 1] | map(attribute='lights') | sum(start=[]) | unique | list }}
      raw_sound: "{{ finale_sound if outcome == 'finale' else abandon_sound }}"
  - variables:
      end_lights: >-
        {{ (lit_lights + finale_extra_lights) | unique | list if outcome == 'finale' else lit_lights }}
      snd:
        id: "{{ (raw_sound.get('media_content_id') if raw_sound is mapping else '') or '' }}"
        type: "{{ (raw_sound.get('media_content_type') if raw_sound is mapping else '') or 'music' }}"
        player: >-
          {{ sound_player or (raw_sound.get('entity_id') if raw_sound is mapping else '') or '' }}

  # The finale or turned-back sound plays in its own branch while the lights
  # run the finale and resting state
  - parallel:
      - if:
          - condition: template
            value_template: "{{ snd.id != '' and snd.player != '' }}"
        then:
          - action: media_player.play_media
            target:
              entity_id: "{{ snd.player }}"
            data:
              media_content_id: "{{ snd.id }}"
              media_content_type: "{{ snd.type }}"
              announce: true
            continue_on_error: true
      - sequence:
          - if:
              - condition: template
                value_template: "{{ outcome == 'finale' and snd.id != '' and snd.player != '' }}"
            then:
              - delay:
                  milliseconds: "{{ sound_delay | int(0) }}"
          - if:
              - condition: template
                value_template: "{{ outcome == 'finale' }}"
            then:
              - variables:
                  jobs: >-
                    {%- set ns = namespace(out=[]) -%}
                    {%- for l in end_lights -%}
                      {%- set ns.out = ns.out + [{'light': l, 'data': look_data[0], 'effect': finale_look.effect}] -%}
                    {%- endfor -%}
                    {{ ns.out }}
              - repeat: *apply_jobs
              - delay: !input finale_duration

          # Resting state
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ end_mode == 'restore' and all_lights | count > 0 }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "scene.{{ snapshot_scene }}"
                    data:
                      transition: "{{ transition_s | float(0) }}"
                    continue_on_error: true
              - conditions:
                  - condition: template
                    value_template: "{{ end_mode == 'look' }}"
                sequence:
                  - variables:
                      jobs: >-
                        {%- set ns = namespace(out=[]) -%}
                        {%- for l in end_lights -%}
                          {%- set ns.out = ns.out + [{'light': l, 'data': look_data[1], 'effect': end_look.effect}] -%}
                        {%- endfor -%}
                        {{ ns.out }}
                  - repeat: *apply_jobs
            default:
              - if:
                  - condition: template
                    value_template: "{{ end_lights | count > 0 }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ end_lights }}"
                    data:
                      transition: "{{ transition_s | float(0) }}"
                    continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ paused | count > 0 }}"
    then:
      - action: homeassistant.turn_on
        target:
          entity_id: "{{ paused }}"
  - if:
      - condition: template
        value_template: "{{ prev_volume is number }}"
    then:
      - action: media_player.volume_set
        target:
          entity_id: "{{ sound_player }}"
        data:
          volume_level: "{{ prev_volume }}"
        continue_on_error: true
  - delay: !input cooldown
