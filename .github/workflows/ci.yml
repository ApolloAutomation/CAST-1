name: CI

on:
  pull_request:

permissions:
  contents: read

# Label check lives in label-check.yml on pull_request_target so it can
# label fork-submitted PRs; plain pull_request tokens are read-only there.
#
# Only the canonical unified config is built: CAST-1_ETH.yaml and
# CAST-1_W.yaml are transitional one-line includes of CAST-1.yaml (kept so
# the legacy manifest paths keep publishing), so building them here would
# just compile the same firmware three times.
jobs:
  ci:
    name: CI
    uses: ApolloAutomation/Workflows/.github/workflows/esphome-ci.yml@main
    with:
      yaml-files: |
        Integrations/ESPHome/CAST-1.yaml
      # dev excluded until the TemplateSelect .state incompatibility is fixed
      esphome-versions: |
        stable
        beta
