name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bypass-yaml-check:
        description: 'Bypass YAML change check (force build/publish)'
        type: boolean
        required: false
        default: false
  # release:
  #   types: [published]

jobs:
  build-and-publish:
    uses: ApolloAutomation/Workflows/.github/workflows/build.yml@main
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    with:
      device-name: cast-1
      yaml-files: |
        Integrations/ESPHome/CAST-1.yaml
      # Maps CAST-1.yaml to the firmware/ output dir (the shared workflow's
      # pattern key is everything after the last dash of the filename).
      firmware-names: "1:firmware"
      core-yaml-path: Integrations/ESPHome/Core.yaml
      # Pinned: ESPHome 2026.10's Sendspin library uses a new handshake that the
      # Music Assistant server we test against rejects, so the player drops out.
      # Unpin once a 2026.10+ build is confirmed to connect to Music Assistant.
      esphome-version: "2026.9.1"
      # Bypass check if manually triggered with bypass option
      check-yaml-changes: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.bypass-yaml-check == 'true') }}
      publish-to-pages: true
      has-installer: true
      installer-path: static