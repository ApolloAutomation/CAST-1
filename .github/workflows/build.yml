name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bypass-yaml-check:
        description: 'Bypass YAML change check (force build/publish)'
        type: boolean
        required: false
        default: false
  # release:
  #   types: [published]

jobs:
  build-and-publish:
    uses: ApolloAutomation/Workflows/.github/workflows/build.yml@main
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    with:
      device-name: cast-1
      # CAST-1_ETH.yaml / CAST-1_W.yaml are transitional includes of the
      # canonical CAST-1.yaml: all three builds are the same unified firmware.
      # The legacy files stay listed ONLY so firmware-e/ and firmware-w/ keep
      # publishing on Pages — fielded devices on the old variants poll those
      # manifests, and a Pages deploy replaces the whole site. Remove the two
      # legacy lines (and files) once the fleet has converged.
      yaml-files: |
        Integrations/ESPHome/CAST-1.yaml
        Integrations/ESPHome/CAST-1_ETH.yaml
        Integrations/ESPHome/CAST-1_W.yaml
      firmware-names: "1:firmware,1_ETH:firmware-e,1_W:firmware-w"
      core-yaml-path: Integrations/ESPHome/Core.yaml
      esphome-version: stable
      # Bypass check if manually triggered with bypass option
      check-yaml-changes: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.bypass-yaml-check == 'true') }}
      publish-to-pages: true
      has-installer: true
      installer-path: static