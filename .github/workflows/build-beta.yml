name: Build and Publish Beta

# Builds CAST-1 firmware from the beta branch and publishes it as assets on a
# rolling "beta" pre-release. The on-device "Firmware Channel" select points OTA
# updates at these assets. Stable firmware is built/published separately by
# build.yml (push to main -> GitHub Pages).
#
# NOTE: the canonical (unified) firmware's Beta manifest is the manifest.json
# asset, which only exists once this workflow has run with the three-entry
# matrix below. After the unified-firmware change lands on main, merge it to
# beta (or run this workflow manually) promptly — until then, canonical-build
# devices switched to the Beta channel get a 404 on their update manifest.

on:
  push:
    branches: [beta]
    paths:
      - 'Integrations/ESPHome/**'
  workflow_dispatch:

# Least privilege: read-only by default; only publish-beta is elevated to write.
permissions:
  contents: read

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.read.outputs.v }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          v=$(awk '/substitutions:/ {f=1} f && /version:/ {print $2; exit}' \
            Integrations/ESPHome/Core.yaml | tr -d '"')
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "Beta version: $v"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    strategy:
      matrix:
        include:
          # The _W/_ETH entries are transitional: those files are one-line
          # includes of CAST-1.yaml, kept only so the legacy beta manifest
          # assets (manifest-w.json / manifest-e.json) keep updating for
          # fielded devices. Remove once the fleet has converged.
          - { yaml: Integrations/ESPHome/CAST-1.yaml,     name: firmware }
          - { yaml: Integrations/ESPHome/CAST-1_W.yaml,   name: firmware-w }
          - { yaml: Integrations/ESPHome/CAST-1_ETH.yaml, name: firmware-e }
    uses: esphome/workflows/.github/workflows/build.yml@9f6577fd37b5cf773ab1b9be929714a0dcd15661 # 2026.7.0
    with:
      files: ${{ matrix.yaml }}
      esphome-version: stable
      combined-name: ${{ matrix.name }}
      release-version: ${{ needs.version.outputs.v }}

  publish-beta:
    name: Publish beta release assets
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: fw
          pattern: firmware*

      - name: Ensure rolling 'beta-fw' pre-release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta-fw -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create beta-fw -R "${{ github.repository }}" \
                 --prerelease --title "Beta (rolling)" \
                 --notes "Latest CAST-1 beta firmware. Auto-updated on every push to the beta branch."

      - name: Rewrite manifests to absolute URLs and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/beta-fw"
          for pair in "firmware:manifest.json" "firmware-w:manifest-w.json" "firmware-e:manifest-e.json"; do
            dir="${pair%%:*}"
            asset="${pair##*:}"
            man=$(find "fw/$dir" -name manifest.json | head -1)
            if [ -z "$man" ]; then
              echo "::error::manifest.json not found for $dir"
              exit 1
            fi
            echo "Rewriting $man -> $asset"
            # Make ota.path and parts[].path absolute release-asset URLs so the
            # device never has to resolve a relative path against a redirected URL.
            jq --arg base "$BASE" '
              .builds[0].ota.path = ($base + "/" + (.builds[0].ota.path | sub(".*/"; "")))
              | .builds[0].parts |= map(.path = ($base + "/" + (.path | sub(".*/"; ""))))
            ' "$man" > "$asset"
            cat "$asset"
            gh release upload beta-fw "$asset" -R "${{ github.repository }}" --clobber
            find "fw/$dir" -name '*.bin' -print -exec \
              gh release upload beta-fw {} -R "${{ github.repository }}" --clobber \;
          done
          echo "Beta assets published."

      - name: Point beta-fw tag at the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh release create tags default-branch HEAD, and uploads never move
          # the tag, so without this the release's source commit drifts away
          # from the assets actually published.
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/beta-fw" \
            -f sha="${{ github.sha }}" -F force=true
          echo "beta-fw -> ${{ github.sha }}"
