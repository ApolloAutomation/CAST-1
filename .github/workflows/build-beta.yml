name: Build and Publish Beta

# Builds CAST-1 firmware from the beta branch and publishes it on the rolling
# beta-fw pre-release, where the Beta firmware channel fetches manifest.json.
# Stable firmware is published by build.yml.

on:
  push:
    branches: [beta]
    paths:
      - 'Integrations/ESPHome/**'
      # A push that only changes this file must rebuild too
      - '.github/workflows/build-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push waits for the running build instead of cancelling it mid-upload.
concurrency:
  group: build-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    permissions:
      contents: write
    uses: ApolloAutomation/Workflows/.github/workflows/build-beta.yml@main
    with:
      # Key "" publishes manifest.json, the name Core.yaml's ota_beta_manifest uses
      variants: '[{"key": "", "yaml": "Integrations/ESPHome/CAST-1.yaml", "name": "firmware"}]'
